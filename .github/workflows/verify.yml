name: Verify

# Lint + test gate. The push trigger is the post-merge alarm on main; the
# pull_request trigger is what branch protection pins against so a PR cannot
# merge with red tests or lint. There is no deploy here: the orchestrator ships
# as a uv tool / PyPI package, not a Coolify app.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # Install exactly what uv.lock pins (`--frozen`: never re-resolve), so CI
      # tests the versions that ship. A fresh `uv pip install` ignored the lock
      # and could pass on versions nobody had locked or reviewed.
      - name: Install from uv.lock
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}

      # Call the venv binaries directly. `uv run` would re-sync against
      # requires-python (3.11), discarding the matrix interpreter, so the 3.13
      # leg would silently test 3.11.
      - name: Ruff
        run: .venv/bin/ruff check

      - name: Pytest
        run: .venv/bin/pytest -q
